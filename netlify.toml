[build]
command = "npm run build"
publish = "dist"
functions = "dist/netlify/functions"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/import-americano"
to = "/.netlify/functions/import-americano"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
